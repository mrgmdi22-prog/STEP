<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>الاختبار التشخيصي · منصة ستيب</title>
<link rel="stylesheet" href="assets/style.css"></head><body>
<header class="top"><a href="./">منصة ستيب</a><small id="pos"></small></header>
<main class="wrap">
<div class="bar"><i id="pb" style="width:0"></i></div>
<div id="app" class="card" style="margin-top:14px"></div>
</main>
<footer>أ. أحمد آل سالم</footer>
<script src="assets/data.js"></script>
<script>
(function(){
var D=window.DIAG, app=document.getElementById('app'), pb=document.getElementById('pb'), pos=document.getElementById('pos');
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var x=a[i];a[i]=a[j];a[j]=x}return a}
var items=[];
D.grammar.forEach(function(q){items.push({s:'grammar',q:q})});
D.vocab.forEach(function(q){items.push({s:'vocab',q:q})});
D.reading.forEach(function(r,i){r.qs.forEach(function(q){items.push({s:'reading',q:q,p:r.p})})});
D.listening.forEach(function(r,i){r.qs.forEach(function(q){items.push({s:'listening',q:q,rec:r,id:i})})});
items.forEach(function(it){it.opts=shuf(it.q.o);it.pick=null});
var i=0, SK={grammar:'القواعد',vocab:'المفردات',reading:'القراءة',listening:'الاستماع'};
var plays={};
function speak(rec,rate){
 if(!window.speechSynthesis){alert('جهازك لا يدعم القراءة الصوتية');return}
 speechSynthesis.cancel();
 var vs=speechSynthesis.getVoices().filter(function(v){return /^en/i.test(v.lang)});
 var male=vs.filter(function(v){return /male|david|daniel|alex|google uk english male/i.test(v.name)})[0]||vs[0];
 var fem=vs.filter(function(v){return /female|zira|samantha|google us english|karen/i.test(v.name)})[0]||vs[1]||vs[0];
 rec.L.forEach(function(l){var u=new SpeechSynthesisUtterance(l[1]);u.lang='en-US';u.rate=rate||0.92;
  var v=(l[0]==='A')?male:fem; if(v)u.voice=v; speechSynthesis.speak(u)});
}
function render(){
 var it=items[i]; pb.style.width=(i/items.length*100)+'%'; pos.innerHTML='<bdi dir="ltr">'+(i+1)+' / '+items.length+'</bdi>';
 var h='<span class="tag">'+SK[it.s]+'</span>';
 if(it.s==='reading')h+='<div class="pass" style="margin-top:10px">'+it.p+'</div>';
 if(it.s==='listening'){var n=plays[it.id]||0;
  h+='<div class="audio" style="margin-top:10px"><button class="btn sec" id="pl">▶ استمع'+(n?' مرة أخرى':'')+'</button><span style="color:#5b6b7c;font-size:.85rem">يمكنك الاستماع مرتين'+(n?' · استمعت '+n:'')+'</span></div>';}
 h+='<div class="q en">'+it.q.q+'</div><div class="opts">';
 it.opts.forEach(function(o,k){h+='<button class="opt'+(it.pick===k?' sel':'')+'" data-k="'+k+'">'+o+'</button>'});
 h+='</div><div class="nav"><button class="btn sec" id="pv"'+(i?'':' disabled')+'>← السابق</button><button class="btn" id="nx"'+(it.pick===null?' disabled':'')+'>'+(i===items.length-1?'إنهاء ✓':'التالي →')+'</button></div>';
 app.innerHTML=h;
 app.querySelectorAll('.opt').forEach(function(b){b.onclick=function(){it.pick=+b.dataset.k;render()}});
 document.getElementById('pv').onclick=function(){if(i>0){i--;render()}};
 document.getElementById('nx').onclick=function(){if(i<items.length-1){i++;render();window.scrollTo(0,0)}else finish()};
 var pl=document.getElementById('pl');
 if(pl)pl.onclick=function(){if((plays[it.id]||0)>=2){alert('استنفدت مرتي الاستماع');return}plays[it.id]=(plays[it.id]||0)+1;speak(it.rec);render()};
}
function finish(){
 speechSynthesis&&speechSynthesis.cancel();
 var sk={},tp={};
 items.forEach(function(it){var ok=it.opts[it.pick]===it.q.o[0];
  sk[it.s]=sk[it.s]||[0,0];sk[it.s][1]++;if(ok)sk[it.s][0]++;
  tp[it.q.t]=tp[it.q.t]||[0,0];tp[it.q.t][1]++;if(ok)tp[it.q.t][0]++;});
 var res={at:Date.now(),skills:sk,topics:tp};
 try{localStorage.setItem('stp.result',JSON.stringify(res));
  var h=JSON.parse(localStorage.getItem('stp.hist')||'[]');h.push(res);localStorage.setItem('stp.hist',JSON.stringify(h.slice(-10)))}catch(e){}
 location.href='plan.html';
}
if(window.speechSynthesis)speechSynthesis.getVoices();
render();
})();
</script><script src="assets/ahmed-shell.js"></script><script src="assets/counter.js"></script></body></html>
